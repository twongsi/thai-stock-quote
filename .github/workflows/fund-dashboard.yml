# อัปเดตข้อมูลกองทุนจาก SEC Open Data API แล้ว deploy GitHub Pages ของ repo นี้
# หน้าแรก = RRG Studio (rrg/docs), dashboard กองทุนอยู่ที่ /fund/
# rrg-weekly.yml สั่งรัน workflow นี้หลังอัปเดต RRG ทุกวันเสาร์
#
# ตั้งค่าครั้งเดียวก่อนใช้งาน
#   1. Settings → Secrets and variables → Actions → New repository secret
#      ชื่อ SEC_API_KEY ค่า = key ที่ขอจาก https://secopendata.sec.or.th/
#   2. Settings → Pages → Source เลือก "GitHub Actions"
#   3. แก้รายชื่อกองทุนที่ fund_dashboard/watchlist.txt
#
# ข้อมูลจำลองต้องเลือก demo=true ด้วยตนเอง; ข้อมูลจริงล้มเหลวจะไม่ deploy ทับเว็บ

name: อัปเดตข้อมูลกองทุน + deploy dashboard

on:
  schedule:
    # 13:30 UTC = 20:30 น. เวลาไทย ทุกวันจันทร์-ศุกร์ (NAV ของวันทำการประกาศในวันถัดไป)
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      years:
        description: 'จำนวนปีของ NAV ย้อนหลังที่จะดึง'
        required: false
        default: '5'
      demo:
        description: 'ใช้ข้อมูลจำลองอย่างชัดเจน (ไม่เรียก SEC API)'
        type: boolean
        default: false
      backend:
        description: 'SEC client backend'
        type: choice
        options: [sec-go, python]
        default: sec-go
  push:
    branches: [main, 'codex/unified-quotes-pinned-sec-go']
    paths:
      - 'fund_dashboard/**'
      - '.github/workflows/fund-dashboard.yml'
      - 'rrg/docs/**'
      - 'tools/sec-bridge/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_BACKEND: ${{ inputs.backend || 'sec-go' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-go@v5
        if: env.SEC_BACKEND == 'sec-go'
        with:
          go-version-file: tools/sec-bridge/go.mod
          cache-dependency-path: tools/sec-bridge/go.sum

      - name: Build pinned twongsi/sec-go bridge
        if: env.SEC_BACKEND == 'sec-go'
        working-directory: tools/sec-bridge
        run: |
          go mod verify
          go test ./...
          go build -trimpath -o ../../bin/sec-bridge .
          ../../bin/sec-bridge --version

      # เก็บ cache ของ factsheet ไว้ข้ามรอบ จะได้ไม่ยิง SEC API ซ้ำโดยไม่จำเป็น
      - uses: actions/cache@v4
        with:
          path: fund_dashboard/cache
          key: sec-cache-v2-${{ github.run_id }}
          restore-keys: sec-cache-v2-

      - name: ตรวจว่าโครงสร้าง API ของ SEC ยังตรงกับโค้ด
        continue-on-error: true
        working-directory: fund_dashboard
        run: python3 selftest.py --spec

      - name: ดึงข้อมูลกองทุนและ build เว็บ
        working-directory: fund_dashboard
        env:
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
          SEC_HISTORY_YEARS: ${{ inputs.years || (github.ref == 'refs/heads/main' && '5' || '1') }}
          SEC_DEMO: ${{ inputs.demo || false }}
        run: |
          if [ "${SEC_DEMO}" = "true" ]; then
            python3 build_static.py --demo --out ../site/fund --years "${SEC_HISTORY_YEARS}"
          else
            if [ -z "${SEC_API_KEY}" ]; then
              echo "::error::ไม่พบ SEC_API_KEY — ไม่เผยแพร่ข้อมูลจำลองแทนข้อมูลจริง"
              exit 1
            fi
            python3 probe_sec.py
            python3 probe_sec.py --discover
            python3 build_static.py --out ../site/fund --years "${SEC_HISTORY_YEARS}"
          fi

      - name: สรุปผลการ build
        if: always()
        run: |
          if [ -f site/fund/summary.md ]; then
            cat site/fund/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build did not produce a summary. See SEC probe/build logs; existing deployment was preserved." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: เอาไฟล์สรุปออกก่อน deploy
        run: rm -f site/fund/summary.md

      # GitHub Pages มีได้เว็บเดียวต่อ repo จึงรวม RRG Studio ไว้ที่หน้าแรก
      - name: ใส่ RRG Studio ที่หน้าแรกของเว็บ
        run: |
          cp -r rrg/docs/. site/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # Pages can return a transient HTTP 500 when creating the deployment.
      # Retry the same built artifact once; a second failure still fails the job.
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
