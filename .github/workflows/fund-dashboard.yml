# อัปเดตข้อมูลกองทุนจาก SEC Open Data API แล้ว deploy GitHub Pages ของ repo นี้
# หน้าแรก = RRG Studio (rrg/docs), dashboard กองทุนอยู่ที่ /fund/
# rrg-weekly.yml สั่งรัน workflow นี้หลังอัปเดต RRG ทุกวันเสาร์
#
# ตั้งค่าครั้งเดียวก่อนใช้งาน
#   1. Settings → Secrets and variables → Actions → New repository secret
#      ชื่อ SEC_API_KEY ค่า = key ที่ขอจาก https://secopendata.sec.or.th/
#   2. Settings → Pages → Source เลือก "GitHub Actions"
#   3. แก้รายชื่อกองทุนที่ fund_dashboard/watchlist.txt
#
# ถ้ายังไม่ได้ใส่ secret workflow จะ build ด้วยข้อมูลจำลองให้ดูหน้าตาก่อน

name: อัปเดตข้อมูลกองทุน + deploy dashboard

on:
  schedule:
    # 13:30 UTC = 20:30 น. เวลาไทย ทุกวันจันทร์-ศุกร์ (NAV ของวันทำการประกาศในวันถัดไป)
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      years:
        description: 'จำนวนปีของ NAV ย้อนหลังที่จะดึง'
        required: false
        default: '5'
  push:
    branches: [main]
    paths:
      - 'fund_dashboard/**'
      - '.github/workflows/fund-dashboard.yml'
      - 'rrg/docs/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # เก็บ cache ของ factsheet ไว้ข้ามรอบ จะได้ไม่ยิง SEC API ซ้ำโดยไม่จำเป็น
      - uses: actions/cache@v4
        with:
          path: fund_dashboard/cache
          key: sec-cache-${{ github.run_id }}
          restore-keys: sec-cache-

      - name: ตรวจว่าโครงสร้าง API ของ SEC ยังตรงกับโค้ด
        continue-on-error: true
        working-directory: fund_dashboard
        run: python3 selftest.py --spec

      - name: ดึงข้อมูลกองทุนและ build เว็บ
        working-directory: fund_dashboard
        env:
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
          SEC_HISTORY_YEARS: ${{ github.event.inputs.years || '5' }}
        run: |
          if [ -z "${SEC_API_KEY}" ]; then
            echo "::warning title=ไม่พบ SEC_API_KEY::build ด้วยข้อมูลจำลองแทน — ใส่ secret SEC_API_KEY เพื่อใช้ข้อมูลจริง"
            python3 build_static.py --demo --out ../site/fund --years "${SEC_HISTORY_YEARS}"
          else
            python3 build_static.py --out ../site/fund --years "${SEC_HISTORY_YEARS}"
          fi

      - name: สรุปผลการ build
        run: cat site/fund/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: เอาไฟล์สรุปออกก่อน deploy
        run: rm -f site/fund/summary.md

      # GitHub Pages มีได้เว็บเดียวต่อ repo จึงรวม RRG Studio ไว้ที่หน้าแรก
      - name: ใส่ RRG Studio ที่หน้าแรกของเว็บ
        run: |
          cp -r rrg/docs/. site/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
