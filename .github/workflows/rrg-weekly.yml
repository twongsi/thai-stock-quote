name: RRG weekly

on:
  schedule:
    # 08:17 Bangkok, Saturday, after the week's last close
    - cron: '17 1 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rrg-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rrg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Prices and RRG Studio page
        run: |
          python build_data.py
          python build_page.py

      - name: Sector rotation snapshot and backtest
        run: python sector_rotation.py --top 3 --rebalance 4 --out reports/latest

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html reports/latest
          if git diff --cached --quiet; then
            echo 'no changes'
          else
            git commit -m "Update RRG $(date -u +%Y-%m-%d)"
            git push || { git pull --rebase -X theirs && git push; }
          fi

      # Publishes rrg/docs as the site when Settings → Pages → Source is "GitHub Actions";
      # skipped quietly otherwise
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rrg/docs
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
